name: Release

# Publication used to be manual, and 0.1.19 went out without its assets because
# of it. This workflow owns the tag path end to end: it builds, it proves the
# BRAT contract holds over the artefacts it is ABOUT to upload, and only then
# does it create the release.
#
# `contents: write` lives here and nowhere else. `ci.yml` runs on every branch
# and every pull request and keeps `contents: read`; giving it write access so a
# tag could publish would hand that token to every branch build too.

on:
  push:
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Reuse ci.yml: if its `check` job already succeeded on this exact SHA, `npm run check` is not repeated.
      # Any doubt (no run yet, failed, query error) leaves ok=false and the gate runs as before.
      - name: Look up the green CI check for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=check&filter=latest" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // ""' 2>/dev/null) || conclusion=""
          if [ "$conclusion" = "success" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "ci.yml job 'check' already passed on $GITHUB_SHA: the repeated step is skipped"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "no green 'check' check-run for $GITHUB_SHA (got '${conclusion:-none}'): the gate runs here"
          fi

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci

      # Same lookup for the `check-guardrails` job of ci.yml.
      - name: Look up the green CI check-guardrails for this commit
        id: ci_guardrails
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=check-guardrails&filter=latest" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // ""' 2>/dev/null) || conclusion=""
          if [ "$conclusion" = "success" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "ci.yml job 'check-guardrails' already passed on $GITHUB_SHA: the repeated step is skipped"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "no green 'check-guardrails' check-run for $GITHUB_SHA (got '${conclusion:-none}'): the gate runs here"
          fi

      # The gate runs inside the publishing job on purpose, unless the lookup above saw
      # ci.yml's `check` job succeed on this exact SHA; then it is not repeated.
      - name: Gate
        if: steps.ci.outputs.ok != 'true'
        run: npm run check

      # `check` leaves out the guardrail suites (the frozen architecture tests,
      # `src/platform`, and the release, BRAT, support, identity and i18n-length
      # contracts). CI runs them as a separate job, but this workflow has no
      # `needs` on it and a tag push does not trigger it, so a release would
      # otherwise publish having proven only the product half.
      - name: Guardrails
        if: steps.ci_guardrails.outputs.ok != 'true'
        run: npm run check:guardrails

      - name: Build the release package
        run: npm run release:package

      # From here to the publication step there is no way to reach `gh release
      # create` with a broken artefact set: the plan refuses to exist if any of
      # the eight files is missing, empty or not a regular file, and the contract
      # then judges that plan exactly as it judges a published release. Eight:
      # the three Obsidian files BRAT installs, the manual-install ZIP and its
      # checksum, and the three files Hebra installs Tyrian from (hebra.json,
      # hebra-main.mjs, hebra-styles.css), which `release:package` builds too.
      - name: Plan the BRAT release
        run: node scripts/brat-release-plan.mjs --from-staging > .release/planned-release.json

      - name: BRAT contract as a pre-publication gate
        run: node scripts/brat-release-contract.mjs --release-json .release/planned-release.json

      - name: Refuse a tag that does not match the manifest
        run: |
          set -euo pipefail
          version="$(node -p 'JSON.parse(require("fs").readFileSync("manifest.json","utf8")).version')"
          if [ "$TAG" != "$version" ]; then
            echo "tag ${TAG} does not equal manifest version ${version}" >&2
            exit 1
          fi

      - name: Collect the exact asset paths
        run: node scripts/brat-release-plan.mjs --asset-paths > .release/asset-paths.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < .release/asset-paths.txt
          if [ "${#assets[@]}" -ne 8 ]; then
            echo "expected 8 assets, planned ${#assets[@]}" >&2
            exit 1
          fi
          # H14.18: the release body used to be a fixed sentence that repeated
          # the tag and named nothing that changed. `changelog-entry.mjs` fails
          # closed (nonzero exit) when `docs/CHANGELOG.md` has no entry for
          # this exact version, which stops a tag from publishing with an
          # undocumented release rather than an empty/wrong body.
          node scripts/changelog-entry.mjs "$TAG" > .release/notes.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file .release/notes.md \
            "${assets[@]}"

      # The contract runs a second time, now against what GitHub actually holds.
      # The gate above is what prevents a bad release; this proves the upload did
      # what the plan said, which is the half that 0.1.19 was missing.
      - name: Confirm the published release against the contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > .release/published-release.json
          node scripts/brat-release-plan.mjs --from-github .release/published-release.json > .release/published-normalised.json
          # The metadata says what GitHub holds; the bytes say whether hebra.json is coherent with them
          # (its version, the sha256 it declares for the Hebra files, GitHub's own digest of each asset).
          gh release download "$TAG" --dir .release/downloaded
          node scripts/brat-release-contract.mjs --release-json .release/published-normalised.json --assets-dir .release/downloaded

      - name: Report the published asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets
